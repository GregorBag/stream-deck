[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dj-poltorashka-desktop"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "pycaw>=20251023,<20270000", "comtypes>=1.4,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-qt>=4.4,<5"]
build = ["pyinstaller>=6,<7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dj_poltorashka*"]

[tool.setuptools.package-data]
"dj_poltorashka.ui" = ["assets/*.qss", "assets/*.png", "assets/*.svg", "qml/*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
