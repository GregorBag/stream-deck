[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dj-poltorashka-desktop"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "pycaw>=20251023,<20270000"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-qt>=4.4,<5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dj_poltorashka*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
